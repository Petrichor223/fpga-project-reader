<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;color:#24334a;background:#f3f6fa;font:14px system-ui,'Microsoft YaHei',sans-serif}header{height:80px;padding:14px 22px;background:#152b47;color:white;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;margin:0 0 6px}header p{margin:0;color:#b8cce3;font-size:12px}.badge{font-size:12px;background:#294866;border-radius:5px;padding:7px 10px}main{display:grid;grid-template-columns:260px minmax(300px,1fr) 310px;height:calc(100vh - 80px)}aside{background:white;overflow:auto;padding:16px;border-right:1px solid #dbe2ed}aside:last-child{border-left:1px solid #dbe2ed;border-right:0}h2{font-size:14px;margin:0 0 12px}h3{font-size:13px;margin:20px 0 8px}button,input,select{font:inherit}select{padding:7px;border:1px solid #cbd6e4;border-radius:5px;background:white;color:#294364}button{cursor:pointer;background:white;border:1px solid #cbd6e4;border-radius:5px;padding:7px 10px;color:#294364}button:hover{background:#e9f1fb}button:disabled{opacity:.5;cursor:wait}input[type=search]{width:100%;padding:8px;border:1px solid #cbd6e4;border-radius:5px;margin-bottom:10px}.tree-row{display:flex;align-items:center;gap:3px;min-height:31px}.tree-row button{border:0;background:transparent;padding:4px;text-align:left;word-break:break-all}.tree-row .toggle{width:24px;flex-shrink:0;color:#4776a9}.tree-row.selected{background:#eaf3ff;border-radius:5px}.tree-row small{color:#7b8799}.viewport{position:relative;overflow:hidden;display:flex;flex-direction:column}.toolbar{display:flex;gap:8px;padding:12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #dbe2ed;align-items:center}.toolbar label{font-size:12px;white-space:nowrap}.canvas{flex:1;min-height:200px;background-image:radial-gradient(#d1dce9 .8px,transparent .8px);background-size:18px 18px}svg{width:100%;height:100%;display:block}.statusbar{padding:8px 14px;background:white;border-top:1px solid #dbe2ed;font-size:12px;color:#68798e;min-height:34px}.help{font-size:12px :310px;box-shadow:0 0 12px #b4c3d2;z-index:4}header{height:80px}}
</style>
<header><div><h1 id="title"></h1><p id="subtitle"></p></div><span class="badge">离线浏览 · 无需运行脚本</span></header>
<main><aside><h2>实例层级</h2><div id="coverage" class="help" style="margin-bottom:12px"></div><input id="search" type="search" placeholder="搜索实例或模块"><div id="tree"></div><h3>阅读边界</h3><div id="scope" class="help"></div><p class="help">默认系统总线；绿色框为板外器件。点击框体展开 / 收起，点击总线查看握手、物理信号与证据。滚轮缩放，拖动平移。虚线框表示内部不可见或尚未分析。</p><details><summary class="help">运行库与许可证</summary><pre class="licenses">@@LICENSES@@</pre></details></aside>
<section class="viewport"><div class="toolbar"><select id="view" aria-label="框图视图"><option value="system">系统总线</option><option value="physical">接口明细</option></select><button id="home">全工程 / 初始视图</button><button id="fit">适应窗口</button><button id="focus">聚焦选中模块</button><button id="level2">展开两级</button><label><input id="control" type="checkbox"> 控制连线</label><label><input id="clocks" type="checkbox" checked> 时钟 / 复位连线</label><label><input id="systemips" type="checkbox"> 显示辅助系统 IP</label><label><input id="debug" type="checkbox"> 调试连线</label></div><div class="canvas"><svg id="schematic" aria-label="可展开 FPGA 工程框图"></svg></div><div class="statusbar"><span id="status">正在布局…</span><span id="error"></span></div></section>
<aside><h2>模块与证据</h2><div id="details" class="detail"></div></aside></main>
<script id="architecture" type="application/json">@@DATA@@</script>
<script>@@VENDOR_JS@@</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('architecture').textContent);
const $=id=>document.getElementById(id), nodes=new Map(), parents=new Map(), numeric=new Map();
let serial=1, busy=false, displayRoot=model.presentation?.root||model.root, selected=model.root.id, focusRoot=displayRoot.id;
const rawNodes=new Map(), rawEdges=new Map();
(function collect(n){rawNodes.set(n.id,n);for(const e of n.edges||[])rawEdges.set(e.id,e);for(const c of n.children||[])collect(c)})(model.root);
const forcedVisible=new Set();
const expanded=new Set([displayRoot.id,model.root.id]);
function architectureMode(){return $('view').value==='system'&&Boolean(model.presentation)}
function resetView(){forcedVisible.clear();displayRoot=architectureMode()?model.presentation.root:model.root;nodes.clear();parents.clear();numeric.clear();serial=1;index(displayRoot,null);focusRoot=displayRoot.id;expanded.clear();expanded.add(displayRoot.id);expanded.add(model.root.id);selected=model.root.id;document.body.classList.toggle('system-view',architectureMode());details(selected);render()}
function index(n,parent){nodes.set(n.id,n);parents.set(n.id,parent);numeric.set(n.id,String(serial++));for(const p of n.ports||[])numeric.set(n.id+'::'+p.id,String(serial++));for(const e of n.edges||[])numeric.set(e.id,String(serial++));for(const c of n.children||[])index(c,n.id)}
index(displayRoot,null);
document.body.classList.toggle("system-view",Boolean(model.presentation));
const svg=d3.select('#schematic'), schematic=new d3.HwSchematic(svg);
for(const renderer of schematic.nodeRenderers.renderers){const prepare=renderer.prepare.bind(renderer);renderer.prepare=function(n){prepare(n);if(architectureMode()){n.height=Math.max(n.height||0,64);n.width=Math.max(n.width||0,160)}}}
const zoom=d3.zoom().scaleExtent([.015,8]).on('zoom',ev=>schematic.root.attr('transform',ev.transform));
svg.call(zoom).on('dblclick.zoom',null);
// The upstream tooltip accepts HTML; render source-derived labels as text instead.
schematic.tooltip.show=function(ev,text){const t=this.tooltip;t.textContent=text;t.style.display='block';t.style.left=(ev.pageX+10)+'px';t.style.top=(ev.pageY+10)+'px';};
function allowed(category){return category==='control'?$('control').checked:category==='clock'||category==='reset'?$('clocks').checked:category==='debug'?$('debug').checked:true}
// Connection filters must never remove IP instances from an expanded hierarchy.
function visible(n){return !n.hidden_by_default||$('systemips').checked||forcedVisible.has(n.id)}
function graph(){
 const active=[], ids=new Set();
 function collect(n){ids.add(n.id);if(expanded.has(n.id))for(const c of n.children||[])if(visible(c))collect(c)}collect(nodes.get(focusRoot));
 for(const n of nodes.values())if(ids.has(n.id)&&expanded.has(n.id))for(const e of n.edges||[])if((e.show_default||allowed(e.category))&&ids.has(e.source.node)&&ids.has(e.target.node))active.push(e);
 const used=new Set();for(const e of active)for(const side of ['source','target'])used.add(e[side].node+'::'+e[side].port);
 function convert(n){
  const children=expanded.has(n.id)?(n.children||[]).filter(visible).map(convert):[];
  const meta={name:(n.children?.length?(expanded.has(n.id)?'− ':'+ '):'')+(n.canvas_label||n.label||n.id.split('.').pop()),instance:n.id,
   bodyText:n.kind==='external'?'OFF-CHIP':n.kind==='board'?'ARCHITECTURE':(n.visibility==='analyzed'?(n.children?.length?n.children.length+' IPs':'RTL'):({not_analyzed:'unread',encrypted:'encrypted',blackbox:'blackbox',missing:'missing'}[n.visibility])),
   cssClass:'kind-'+(n.kind==='external'?'external':n.kind==='board'?'board':n.category||'data')+(n.visibility==='analyzed'?'':' opaque')};
  const ports=(n.ports||[]).filter(p=>used.has(n.id+'::'+p.id)).map((p,i)=>({id:numeric.get(n.id+'::'+p.id),direction:p.direction==='output'?'OUTPUT':'INPUT',
   hwMeta:{name:architectureMode()?'':p.label||p.id,level:0},properties:{side:p.side||(p.direction==='output'?'EAST':'WEST'),index:i}}));
  const edges=active.filter(e=>(n.edges||[]).includes(e)).map(e=>({id:numeric.get(e.id),source:numeric.get(e.source.node),sourcePort:numeric.get(e.source.node+'::'+e.source.port),target:numeric.get(e.target.node),targetPort:numeric.get(e.target.node+'::'+e.target.port),hwMeta:{name:(e.label||e.id)+(e.flow==='bidirectional'?' ↔':''),modelId:e.id,category:e.category,relation:e.relation}}));
  const result={id:numeric.get(n.id),hwMeta:meta,ports,properties:{'org.eclipse.elk.portConstraints':'FIXED_ORDER','elk.layered.spacing.nodeNodeBetweenLayers':140,'elk.spacing.nodeNode':32,'elk.padding':'[top=48,left=32,bottom=32,right=32]'},edges};
  if(children.length)result.children=children;
  return result;
 }
 return {id:'0',hwMeta:{name:'',maxId:serial+1000},ports:[],properties:{'elk.algorithm':'layered','elk.direction':'RIGHT','elk.layered.spacing.nodeNodeBetweenLayers':70},children:[convert(nodes.get(focusRoot))],edges:[]};
}
function text(parent,tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e}
function evidence(parent,refs){for(const id of [...new Set(refs||[])]){const e=model.evidence[id];if(!e)continue;const a=text(parent,'a',e.file+':'+e.line,'evidence');a.title='SHA256 '+e.sha256;a.href='file:///'+encodeURI((model.project_root+'/'+e.file).replaceAll('\\','/')).replaceAll('#','%23')+'#L'+e.line;a.target='_blank';a.rel='noopener'}}
const states={confirmed:'已确认',inferred:'功能推断',unknown:'未知'};
function details(id){selected=id;const n=nodes.get(id),d=$('details');d.replaceChildren();text(d,'b',n.label||n.module);text(d,'p',n.id);text(d,'span',states[n.status],'pill');text(d,'span',n.kind==='external'?'板外器件':n.kind==='board'?'架构容器（非 RTL）':n.visibility,'pill');if(n.configuration_component)text(d,'span','Qsys 配置组件','pill');text(d,'p',n.description||'功能尚未确认');if(n.hidden_by_default)text(d,'p',n.hide_reason,'help');const cs=n.children||[];if(cs.length){text(d,'h3',(n.kind==='board'?'板级组成 · ':'全部直接子实例 · ')+cs.length);for(const c of cs){const b=text(d,'button',c.label+' · '+c.module);b.style.cssText='display:block;width:100%;margin:5px 0;text-align:left;font-size:11px;overflow-wrap:anywhere';b.onclick=()=>reveal(c.id)}}const coverage=(model.coverage||[]).find(x=>x.instance===id);if(coverage){text(d,'h3','配置覆盖核对');text(d,'p',coverage.matched_components.length+' / '+coverage.enabled_components.length+' 个启用组件已收录；另有 '+coverage.generated_infrastructure.length+' 个综合生成实例。');if(coverage.missing_components.length)text(d,'p','缺失：'+coverage.missing_components.join(', '));evidence(d,coverage.evidence)}text(d,'h3','源码证据');evidence(d,n.evidence);if(n.clocks?.length){text(d,'h3','相关时钟');for(const c of n.clocks){text(d,'p',c.name+' · '+(c.frequency_hz===null?'频率未知':c.frequency_hz/1e6+' MHz')+' · '+(c.relation||''));evidence(d,c.evidence)}}text(d,'h3','接口');for(const p of n.ports||[]){const box=document.createElement('details');d.append(box);text(box,'summary',(p.label||p.id)+' · '+p.direction+' · '+p.members.length+' 信号');text(box,'pre',p.members.map(m=>m.name+' '+(m.width||'')).join('\n'))}if(n.limits)text(d,'p',n.limits,'help');tree()}
function edgeDetails(edge){
 const d=$('details');d.replaceChildren();text(d,'b',edge.label||edge.id);text(d,'span',states[edge.status],'pill');
 text(d,'p',edge.source.node+(edge.flow==='bidirectional'?' ↔ ':' → ')+edge.target.node);
 if(edge.member_edges){text(d,'p',edge.flow==='bidirectional'?'双向逻辑总线；线路表示整个接口。':'箭头表示主数据/请求流向；ready 与响应保留各自真实方向。');text(d,'p',edge.description||'');
 text(d,'h3','原始接口连接 · '+edge.member_edges.length);for(const id of edge.member_edges){const e=rawEdges.get(id);const box=document.createElement('details');d.append(box);text(box,'summary',e.label+' · '+e.signals.length+' 信号');text(box,'p',e.source.node+' → '+e.target.node);text(box,'pre',e.signals.map(s=>s.source+' → '+s.target+'\n  '+s.net).join('\n'));evidence(box,e.evidence)}
 if(edge.mappings?.length){text(d,'h3','补充 / 板级接口映射');text(d,'pre',edge.mappings.map(s=>s.source+' ↔ '+s.target+'\n  '+s.expression).join('\n'))}
 }else{text(d,'pre',edge.signals.map(s=>s.source+' → '+s.target+'\n  '+s.net).join('\n'))}
 evidence(d,edge.evidence);
}
function tree(){const target=$('tree');target.replaceChildren();const query=$('search').value.toLowerCase();function match(n){return (n.id+' '+n.module).toLowerCase().includes(query)||(n.children||[]).some(match)}function row(n,depth){if(query&&!match(n))return;const r=document.createElement('div');r.className='tree-row'+(n.id===selected?' selected':'');r.style.paddingLeft=(depth*13)+'px';r.dataset.instance=n.id;target.append(r);const t=text(r,'button',n.children?.length?(expanded.has(n.id)?'−':'+'):'·','toggle');t.title='展开 / 收起';t.onclick=()=>toggle(n.id);const label=text(r,'button',(n.canvas_label||n.label||n.id.split('.').pop())+(n.children?.length?' ['+n.children.length+']':'')+(n.hidden_by_default?' · 默认隐藏':''));label.onclick=()=>reveal(n.id);if(n.visibility!=='analyzed')label.title='内部不可见或尚未分析';if(expanded.has(n.id)||query)for(const c of n.children||[])row(c,depth+1)}row(displayRoot,0)}
function reveal(id){forcedVisible.add(id);const ancestors=[];let p=parents.get(id);while(p){ancestors.push(p);p=parents.get(p)}if(id!==focusRoot&&!ancestors.includes(focusRoot))focusRoot=displayRoot.id;ancestors.forEach(x=>{expanded.add(x);forcedVisible.add(x)});details(id);render()}
function toggle(id){if(busy)return;forcedVisible.add(id);details(id);const n=nodes.get(id);if(!n.children?.length)return;expanded.has(id)?expanded.delete(id):expanded.add(id);render()}
async function drawGraph(){if(busy)return;busy=true;window.__fpgaReady=false;$('error').textContent='';$('status').textContent='正在重新布局…';for(const b of document.querySelectorAll('.toolbar button'))b.disabled=true;try{await schematic.bindData(graph());schematic.root.selectAll('g.node').attr('data-instance',d=>d.hwMeta.instance).on('click',function(ev,d){ev.stopPropagation();toggle(d.hwMeta.instance)});schematic.root.selectAll('.link-wrap').on('click.evidence',function(ev,d){let e=d;while(e.hwMeta?.parent)e=e.hwMeta.parent;const id=e.hwMeta?.modelId||d.hwMeta?.modelId;for(const n of nodes.values()){const edge=(n.edges||[]).find(x=>x.id===id);if(edge){edgeDetails(edge);break}}});if(architectureMode())schematic.root.selectAll('g.node').each(function(){const texts=[...this.children].filter(c=>c.tagName==='text');if(texts[0]){texts[0].setAttribute('x',10);texts[0].setAttribute('y',20)}if(texts[1])for(const t of texts[1].querySelectorAll('tspan')){t.setAttribute('y',43);t.style.fontSize='11px'}});styleWires();labelBuses();$('status').textContent='RTL '+rawNodes.size+' 个 · '+(architectureMode()?'系统总线（含板外器件）':'接口明细')+' · 当前 '+schematic._nodes.length+' 个框 / '+schematic._edges.length+' 条线 · 辅助系统 IP 默认隐藏 '+[...nodes.values()].filter(n=>n.hidden_by_default&&!visible(n)).length+' 个';tree();window.__fpgaReady=true;}catch(err){$('error').textContent='布局失败：'+err.message;console.error(err)}finally{busy=false;for(const b of document.querySelectorAll('.toolbar button'))b.disabled=false}}
function styleWires(){schematic.root.selectAll('.link').each(function(d){let e=d;while(e.hwMeta?.parent)e=e.hwMeta.parent;const meta=e.hwMeta||d.hwMeta||{};d3.select(this).classed('wire-clock',meta.category==='clock').classed('wire-reset',meta.category==='reset').classed('wire-dependency',meta.relation==='logic_dependency')})}
function labelBuses(){
 if(!architectureMode())return;
 // Label the longest orthogonal segment; labels do not intercept wire clicks.
 schematic.root.selectAll('.link').each(function(d){let original=d;while(original.hwMeta?.parent)original=original.hwMeta.parent;const id=original.hwMeta?.modelId;const rootEdges=nodes.get(model.root.id)?.edges||[];const bus=rootEdges.find(e=>e.id===id);if(bus&&[bus.source.node,bus.target.node].includes(model.root.id))return;if(['clock','reset'].includes(original.hwMeta?.category))return;const label=original.hwMeta?.name||d.hwMeta?.name||'';const sections=d.sections||[];if(!sections.length)return;let best=null;
 for(const sec of sections){const pts=[sec.startPoint,...(sec.bendPoints||[]),sec.endPoint];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],len=Math.hypot(a.x-b.x,a.y-b.y);if(a.y===b.y&&len>label.length*6+10&&(!best||len>best.len))best={a,b,len}}}
 if(!best)return;const parent=this.parentNode;const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','bus-label');t.setAttribute('x',(best.a.x+best.b.x)/2);t.setAttribute('y',(best.a.y+best.b.y)/2-7);t.setAttribute('text-anchor','middle');let e=d;while(e.hwMeta?.parent)e=e.hwMeta.parent;t.textContent=e.hwMeta?.name||d.hwMeta?.name||'';parent.append(t);
 });
}
function fit(){const g=schematic.root.node();if(!g||!g.children.length)return;schematic.root.interrupt();const b=g.getBBox(),r=svg.node().getBoundingClientRect(),k=Math.min((r.width-48)/Math.max(b.width,1),(r.height-48)/Math.max(b.height,1),1.5);const t=Object.assign(Object.create(Object.getPrototypeOf(d3.zoomIdentity)),{k,x:(r.width-b.width*k)/2-b.x*k,y:(r.height-b.height*k)/2-b.y*k});svg.call(zoom.transform,t);}
async function render(){await drawGraph();fit();}
$('focus').onclick=()=>{focusRoot=selected;expanded.add(focusRoot);render()};
$('home').onclick=resetView;$('view').onchange=resetView;$('fit').onclick=fit;$('level2').onclick=()=>{expanded.clear();expanded.add(focusRoot);const base=focusRoot===displayRoot.id&&displayRoot.kind==='board'?model.root.id:focusRoot;expanded.add(base);for(const c of nodes.get(base).children||[])if(c.children?.length)expanded.add(c.id);render()};for(const id of ['control','clocks','debug','systemips'])$(id).onchange=()=>render();$('search').oninput=tree;
$('title').textContent=model.title||'FPGA 工程框图';$('subtitle').textContent=model.config+' · '+(model.mode==='detailed'?'详细模式':'快速模式')+' · '+(model.presentation?.updated_on||model.generated_at||'');$('scope').textContent=(model.presentation?.scope||'')+' '+model.scope;const coverageRows=model.coverage||[], configured=coverageRows.reduce((a,c)=>a+c.enabled_components.length,0),matched=coverageRows.reduce((a,c)=>a+c.matched_components.length,0),opaque=[...rawNodes.values()].filter(n=>n.visibility!=='analyzed').length;$('coverage').textContent='已收录 '+rawNodes.size+' 个 RTL 实例'+(coverageRows.length?'；Qsys 启用组件 '+matched+'/'+configured:'')+'。其中 '+opaque+' 个实例内部尚未分析或不可见。层级树保留全部 IP；辅助系统 IP 可恢复，时钟/复位默认连接。';if(model.diagram_source)$('scope').textContent+=' 数据来源：'+model.diagram_source.reason;details(model.root.id);
new ResizeObserver(()=>{if(!busy)fit()}).observe(svg.node());
window.fpgaViewer={model,expanded,nodes,rawNodes,rawEdges,toggle,render,get displayRoot(){return displayRoot},get focusRoot(){return focusRoot},get busy(){return busy},get schematic(){return schematic}};
render();
</script></html>
